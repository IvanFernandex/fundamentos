name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Tests automatizados — pytest
      id: tests-automatizados-pytest
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Tests automatizados — pytest
        setup-command: pip install -r requirements.txt
        command: pytest tests/ -v
        timeout: 5
        max-score: 100
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        TESTS-AUTOMATIZADOS-PYTEST_RESULTS: "${{steps.tests-automatizados-pytest.outputs.result}}"
      with:
        runners: tests-automatizados-pytest
